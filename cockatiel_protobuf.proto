syntax = "proto3";
package cockatiel_protobuf.v1;

// ==========================================
// ENUMS (Strict type safety instead of strings)
// ==========================================

enum ProcessPosition {
  PROCESS_POSITION_UNSPECIFIED = 0;
  PROCESS_POSITION_PREPROCESS = 1;
  PROCESS_POSITION_INPROCESS = 2;
  PROCESS_POSITION_POSTPROCESS = 3;
  PROCESS_POSITION_CONNECTION = 4;
}

enum FlagLimitType {
  FLAG_LIMIT_TYPE_UNSPECIFIED = 0;
  FLAG_LIMIT_TYPE_ANY = 1;
  FLAG_LIMIT_TYPE_OPTIONS = 2;
  FLAG_LIMIT_TYPE_RANGE = 3;
}

enum PlatformSendLevel {
  PLATFORM_SEND_LEVEL_UNSPECIFIED = 0;
  PLATFORM_SEND_LEVEL_SELF = 1;
  PLATFORM_SEND_LEVEL_OTHERS = 2;
  PLATFORM_SEND_LEVEL_ALL = 3;
}

enum EventCategory {
  EVENT_CATEGORY_UNSPECIFIED = 0;
  EVENT_CATEGORY_LOG = 1;
  EVENT_CATEGORY_WARNING = 2;
  EVENT_CATEGORY_ERROR = 3;
  EVENT_CATEGORY_SYSTEM = 4;
  EVENT_CATEGORY_USER_MESSAGE = 5;
}

// ==========================================
// CORE DATA STRUCTURES
// ==========================================

message AuthNew {
  string new_auth = 1;
}

message AuthVerify {
  string cur_auth = 1;
}

message Ban {
  string commender_uuid7 = 1;
  string commendee_uuid7 = 2;
  bool unbanned = 3;
  string reason = 4;
  string raw_message = 5;
  repeated string appeals = 6;
}

message Flag {
  string flag_name = 1;
  string flag_description = 2;
  FlagLimitType limiting_type = 3;
  float min_val = 4;
  float max_val = 5;
  repeated string options = 6;
}

message Command {
  string command_name = 1;
  string command_flag = 2;
  string command_description = 3;
  repeated Flag command_flags = 4;
}

message Commands {
  repeated Command commands = 1;
}

message Commendation {
  string commender_uuid7 = 1;
  string commendee_uuid7 = 2;
  string raw_message = 3;
  string reason = 4;
}

message Reprimand {
  string commender_uuid7 = 1;
  string commendee_uuid7 = 2;
  string raw_message = 3;
  string reason = 4;
}

message UserStylingTemplate {
   map<string, string> css_properties = 1;
}

message UserData {
  string uuid = 1;
  string username = 2;
  bool is_sponsor = 3;
  bool is_moderator = 4;
  bool is_admin = 5;
  bool is_owner = 6;
  repeated Ban bans = 7;
  repeated Commendation commendations = 8; // Fixed naming mismatch
  UserStylingTemplate styling = 9;
  
  // Use maps for platform-specific IDs rather than separate repeated strings
  map<string, string> platform_ids = 10; 
}

// ==========================================
// SYSTEM & CONNECTION STRUCTURES
// ==========================================

message ConnectionRequest {
  int32 pin = 1;
  ProcessPosition process_position = 2; // Replaced string with strict Enum
  uint32 priority = 3; // Priorities cannot be negative
  string module_instance_uuid7 = 4;
}

message ConnectionRequestReturn {
  uint32 new_port = 1; // Ports cannot be negative
  string module_instance_uuid7 = 2;
}

message Err {
  string log = 1;
  bytes blob = 2; // Raw arbitrary data should be bytes, not string
  string trace = 3;
}

message Log {
  string log = 1;
  bytes blob = 2;
}

message Shutdown {
  string reason = 1;
}

message SendToPlatforms { // Fixed typo (Platfroms -> Platforms)
  string msg = 1;
  PlatformSendLevel level = 2; // Replaced string with strict Enum
  string module_uuid7 = 3;
  string pid = 4;
}

// ==========================================
// MESSAGE PIPELINE (Refactored for DRY code)
// ==========================================

// Core message data shared across all processing stages
message ChatMessage {
  string platform = 1;
  bytes raw_data = 2; // Use bytes for vague JSON/platform payloads, not strings
  string raw_message = 3;
  string user_uuid7 = 4;
  Command command = 5;
  UserData user_data = 6; // Strongly typed, not a string
}

message MessagePreProcess {
  ChatMessage core_message = 1;
}

message MessageInProcess {
  ChatMessage core_message = 1;
  string processed_message = 2;
  bool abandon_message = 3;
}

message MessagePostProcess {
  ChatMessage core_message = 1;
  string processed_message = 2;
}

// ==========================================
// TIMELINE
// ==========================================

message TimelineEvent {
  string timeline_id_uuid7 = 1; // Formerly 'i' - THIS IS THE PRIMARY KEY
  EventCategory event_type = 2; // Formerly 't'
  string command_flag = 3;      // Formerly 'c'
  bytes data_blob = 4;          // Formerly 'd'
  string error_message = 5;     // Formerly 'e'
  string raw_flags = 6;         // Formerly 'f'
  string message_origin = 7;    // Formerly 'o'
  string stream_origin = 8;     // Formerly 's'
  string raw_message = 9;       // Formerly 'r'
  string processed_message = 10;// Formerly 'p'
  string user_uuid7 = 11;       // Formerly 'u'
  uint32 version = 12;          // Formerly 'v' (cannot be negative)
}

// ==========================================
// THE ROOT CONTAINER ENVELOPE
// ==========================================

message Container {
  int32 version = 1;
  // reserved 2; // If you previously deleted field 2, mark it reserved
  string auth_token = 3;
  string module_name = 4;
  string module_instance_uuid7 = 5;
  // reserved 6; // Mark reserved if previously used
  
  oneof payload {
    ConnectionRequest connection_request = 7;
    ConnectionRequestReturn connection_request_return = 8;
    AuthVerify auth_verify = 9;
    AuthNew auth_new = 10;
    Command command_payload = 11;
    Commands commands_payload = 12;
    MessagePreProcess message_pre_process = 13;
    MessageInProcess message_in_process = 14;
    MessagePostProcess message_post_process = 15;
    TimelineEvent timeline_event = 16;
    UserData user_data = 17;
    Shutdown shutdown = 18;
    Log log = 19;
    Err err = 20;
    SendToPlatforms send_to_platforms = 21;
  }
}
